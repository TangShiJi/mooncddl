name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Format with current toolchain
        run: |
          moon fmt
          git diff -- '*.mbt' > latest-format.patch

      - name: Check formatting
        run: git diff --exit-code -- '*.mbt'

      - name: Upload formatter patch on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latest-format-patch
          path: latest-format.patch
          retention-days: 1

      - name: Check all supported targets
        run: moon check --target all --deny-warn

      - name: Test all supported targets
        run: moon test --target all --deny-warn

      - name: Verify public API and package contents
        run: |
          moon info
          moon package --list

      - name: Run examples
        run: |
          moon run --target native examples/json_api
          moon run --target native examples/cbor_iot
          moon run --target native examples/fixture_generation
          moon run --target native examples/standard_contract
          moon run --target native cmd/main -- check-syntax 'root = pair<uint,tstr> pair<a,b> = [a,b]'
          if moon run --target native cmd/main -- check-syntax 'root = ['; then
            echo 'Malformed standard syntax unexpectedly succeeded'
            exit 1
          fi

      - name: Build release CLI
        run: moon build --target native --release cmd/main

      - name: Install independent test tools
        run: |
          python -m pip install lxml==6.0.2
          mkdir -p "$RUNNER_TEMP/cddl-reference"
          curl -fsSL https://github.com/anweiss/cddl/releases/download/v0.10.7/cddl-linux-amd64.tar.gz -o "$RUNNER_TEMP/cddl-reference/cddl.tar.gz"
          tar -xzf "$RUNNER_TEMP/cddl-reference/cddl.tar.gz" -C "$RUNNER_TEMP/cddl-reference"
          find "$RUNNER_TEMP/cddl-reference" -type f -name cddl -exec chmod +x {} \;

      - name: Verify standard behavior and independent comparisons
        run: |
          CLI=$(find _build/native/release/build/cmd/main -type f -executable -name '*.exe' | head -1)
          REFERENCE=$(find "$RUNNER_TEMP/cddl-reference" -type f -name cddl | head -1)
          test -n "$CLI"
          test -n "$REFERENCE"
          python scripts/differential.py --cli "$CLI" --reference "$REFERENCE"
          python scripts/xsd_differential.py --cli "$CLI"

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-conformance
          path: |
            _build/differential.json
            _build/xsd-differential.json
