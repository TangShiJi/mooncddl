name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Format with current toolchain
        run: |
          moon fmt
          git diff -- '*.mbt' > latest-format.patch

      - name: Check formatting
        run: git diff --exit-code -- '*.mbt'

      - name: Upload formatter patch on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latest-format-patch
          path: latest-format.patch
          retention-days: 1

      - name: Check all supported targets
        run: moon check --target all --deny-warn

      - name: Test all supported targets
        run: moon test --target all --deny-warn

      - name: Verify public API and package contents
        run: |
          moon info
          moon package --list

      - name: Run examples
        run: |
          moon run --target native examples/json_api
          moon run --target native examples/cbor_iot
          moon run --target native examples/fixture_generation
